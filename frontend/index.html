<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>autorun</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236f9dff'/%3E%3Cstop offset='1' stop-color='%233b5fd9'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='4' y='4' width='56' height='56' rx='16' fill='url(%23g)'/%3E%3Cpath d='M26 20l18 12-18 12z' fill='white'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <aside class="sidebar glass">
            <header class="sidebar-header">
                <div class="logo">
                    <span class="logo-mark" aria-hidden="true">
                        <svg viewBox="0 0 16 16" width="12" height="12"><path d="M4.5 2.5l9 5.5-9 5.5z" fill="currentColor"/></svg>
                    </span>
                    <span class="logo-text">autorun</span>
                    <span class="platform-badge" id="platform-badge">&hellip;</span>
                </div>
            </header>

            <div class="scope-toggle">
                <span class="scope-thumb" aria-hidden="true"></span>
                <button class="scope-btn active" data-scope="all">All</button>
                <button class="scope-btn" data-scope="system">System</button>
                <button class="scope-btn" data-scope="user">User</button>
            </div>

            <div class="search-container">
                <svg class="search-icon" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                <input type="text" class="search-input" id="search-input" placeholder="Search services" autocomplete="off" spellcheck="false">
            </div>

            <div class="service-list" id="service-list">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <span>Loading services&hellip;</span>
                </div>
            </div>

            <footer class="sidebar-footer">
                <div class="service-count"><span id="service-count">0</span> services</div>
                <button class="create-btn" id="create-btn">
                    <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
                    New service
                </button>
            </footer>
        </aside>

        <main class="main-panel glass">
            <div class="empty-state" id="empty-state">
                <div class="empty-lens" aria-hidden="true"></div>
                <div class="empty-text">Select a service</div>
                <div class="empty-subtext">Details and live logs appear here</div>
            </div>

            <div class="service-detail" id="service-detail" style="display: none;">
                <header class="detail-header">
                    <div class="detail-title-row">
                        <div class="status-indicator" id="detail-status"></div>
                        <h1 class="detail-name" id="detail-name">service-name</h1>
                        <span class="detail-scope" id="detail-scope">user</span>
                    </div>
                    <p class="detail-description" id="detail-description"></p>
                </header>

                <div class="control-panel">
                    <div class="control-group">
                        <span class="control-label">Run</span>
                        <div class="btn-cluster">
                            <button class="ctrl-btn" data-action="start" title="Start">
                                <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M4.5 2.5l9 5.5-9 5.5z" fill="currentColor"/></svg>
                                Start
                            </button>
                            <button class="ctrl-btn" data-action="stop" title="Stop">
                                <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><rect x="3.5" y="3.5" width="9" height="9" rx="1.5" fill="currentColor"/></svg>
                                Stop
                            </button>
                            <button class="ctrl-btn" data-action="restart" title="Restart">
                                <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.5-3.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M13 1.5V5h-3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                Restart
                            </button>
                        </div>
                    </div>
                    <div class="control-group">
                        <span class="control-label">Startup</span>
                        <div class="btn-cluster">
                            <button class="ctrl-btn" data-action="enable" title="Start automatically at boot or login">
                                <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M8 1.5v6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M11.5 3.6a5.5 5.5 0 1 1-7 0" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
                                Enable
                            </button>
                            <button class="ctrl-btn" data-action="disable" title="Don't start automatically">
                                <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><circle cx="8" cy="8" r="5.75" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M4.5 8h7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
                                Disable
                            </button>
                        </div>
                    </div>
                    <div class="control-spacer"></div>
                    <button class="ctrl-btn danger" id="delete-btn" title="Delete service">
                        <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M2.5 4h11M6.5 2h3M5 4l.6 9a1 1 0 0 0 1 .9h2.8a1 1 0 0 0 1-.9L11 4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        Delete
                    </button>
                </div>

                <div class="log-panel">
                    <header class="log-header">
                        <div class="log-title">Logs</div>
                        <div class="log-status" id="log-status">
                            <span class="log-dot"></span>
                            Disconnected
                        </div>
                    </header>
                    <div class="log-viewer" id="log-viewer">
                        <div class="log-content" id="log-content">
                            <div class="log-placeholder">Connecting to logs&hellip;</div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <!-- Create Service Modal -->
    <div class="modal-overlay" id="create-modal" style="display: none;">
        <div class="modal glass">
            <header class="modal-header">
                <h2>New service</h2>
                <button class="modal-close" id="create-modal-close" aria-label="Close">
                    <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
                </button>
            </header>
            <form id="create-form" class="modal-form">
                <div class="form-row">
                    <div class="form-group grow">
                        <label for="create-name">Name</label>
                        <input type="text" id="create-name" required placeholder="com.example.myservice" autocomplete="off" spellcheck="false">
                    </div>
                    <div class="form-group">
                        <label for="create-scope">Scope</label>
                        <select id="create-scope">
                            <option value="user">User</option>
                            <option value="system">System</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="create-program">Program</label>
                    <input type="text" id="create-program" required placeholder="/usr/local/bin/myprogram" autocomplete="off" spellcheck="false">
                </div>
                <div class="form-group">
                    <label for="create-arguments">Arguments</label>
                    <input type="text" id="create-arguments" placeholder="--flag value (space-separated)" autocomplete="off" spellcheck="false">
                </div>
                <div class="form-group">
                    <label for="create-description">Description</label>
                    <input type="text" id="create-description" placeholder="What this service does" autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="create-workdir">Working directory</label>
                    <input type="text" id="create-workdir" placeholder="/path/to/workdir" autocomplete="off" spellcheck="false">
                </div>
                <div class="form-row checkboxes">
                    <div class="form-group checkbox-group">
                        <input type="checkbox" id="create-runatload" checked>
                        <label for="create-runatload">Start immediately</label>
                    </div>
                    <div class="form-group checkbox-group">
                        <input type="checkbox" id="create-keepalive">
                        <label for="create-keepalive">Restart if it stops</label>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="button" class="modal-btn cancel" id="create-cancel">Cancel</button>
                    <button type="submit" class="modal-btn submit">Create service</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal-overlay" id="delete-modal" style="display: none;">
        <div class="modal modal-small glass">
            <header class="modal-header">
                <h2>Delete service</h2>
            </header>
            <div class="modal-body">
                <p>Delete <strong id="delete-service-name"></strong>?</p>
                <p class="warning-text">Its service file is removed permanently.</p>
            </div>
            <div class="form-actions">
                <button type="button" class="modal-btn cancel" id="delete-cancel">Cancel</button>
                <button type="button" class="modal-btn delete" id="delete-confirm">Delete</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
